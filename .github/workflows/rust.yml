name: Rust
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'www/**'
  pull_request:
    paths-ignore:
      - 'www/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
            toolchain: stable
            override: true
      - name: Rust build
        run: cd crates/client && cargo build --release
