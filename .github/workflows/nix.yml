name: Nix
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'www/**'
  pull_request:
    paths-ignore:
      - 'www/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Nix version
        run: nix --version
      - name: Nix build
        run: nix build -L .#packages.x86_64-linux.process-compose
